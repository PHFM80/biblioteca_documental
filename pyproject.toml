[project]
name = "biblioteca-documental"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.9",
    "faiss-cpu>=1.14.3",
    "flet>=0.85.3",
    "langdetect>=1.0.9",
    "mypy>=2.1.0",
    "numpy>=2.5.1",
    "onnxruntime>=1.27.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "pywin32>=312",
    "rich>=15.0.0",
    "ruff>=0.15.20",
    "sentence-transformers>=5.6.0",
    "tqdm>=4.68.3",
    "watchdog>=6.0.0",
    "whoosh>=2.7.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
